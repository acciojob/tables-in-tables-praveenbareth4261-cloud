<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Nested Tables</title>
</head>
<body>

    <!-- Main Outer Table -->
    <table border="1" style="width: 100%; border-collapse: separate; border-spacing: 2px;">
        
        <!-- Row 1 -->
        <tr>
            <!-- Top-Left Cell: Nested Table 2 -->
            <td style="width: 50%; padding: 40px 5px;">
                <table border="1" style="width: 100%; text-align: center;">
                    <tr>
                        <th colspan="2">Nested Table 2</th>
                    </tr>
                    <tr>
                        <th>Column 1</th>
                        <th>Column 2</th>
                    </tr>
                    <tr>
                        <td>abc</td>
                        <td>def</td>
                    </tr>
                </table>
            </td>

            <!-- Top-Right Cell: Nested Table 1 -->
            <td style="width: 50%; padding: 20px 5px;">
                <table border="1" style="width: 100%;">
                    <tr>
                        <th>Nested Table 1</th>
                    </tr>
                    <tr>
                        <td style="padding: 15px 0;">
                            <ul style="width: fit-content; margin: 0 auto; text-align: left; padding-left: 80px;">
                                <li style="padding-left: 60px;">List item 1</li>
                                <li style="padding-left: 60px;">List item 2</li>
                                <li style="padding-left: 60px;">List item 3</li>
                            </ul>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>

        <!-- Row 2 -->
        <tr>
            <!-- Bottom-Left Cell: Nested Table 3 -->
            <td style="padding: 15px 5px;">
                <table border="1" style="width: 100%; text-align: center;">
                    <tr>
                        <th colspan="2">Nested Table 3</th>
                    </tr>
                    <tr>
                        <td><a href="#" style="color: purple;">Nested Table</a></td>
                        <td>Demo Continued</td>
                    </tr>
                </table>
            </td>

            <!-- Bottom-Right Cell: Nested Table 4 -->
            <td style="padding: 15px 5px;">
                <table border="1" style="width: 100%; text-align: center;">
                    <tr>
                        <th>Nested Table 4</th>
                    </tr>
                    <tr>
                        <td style="background-color: black; color: white;">HTML</td>
                    </tr>
                </table>
            </td>
        </tr>

    </table>

</body>
</html>
